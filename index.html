<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NightFit">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Smart fitness, diet, expense & progress tracker for night shift workers">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23000' width='192' height='192'/><text x='96' y='140' font-size='120' font-weight='bold' text-anchor='middle' fill='%2310b981' font-family='system-ui'>⚡</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23000' width='180' height='180'/><text x='90' y='140' font-size='110' font-weight='bold' text-anchor='middle' fill='%2310b981' font-family='system-ui'>⚡</text></svg>">
  
  <title>NightFit Tracker - Smart Fitness for Night Shift Workers</title>

  <style>
    * {
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
    }
    
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
      overscroll-behavior: none;
    }

    html {
      scroll-behavior: smooth;
    }

    /* Prevent rubber band scrolling */
    body {
      position: fixed;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #root {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    @supports (padding: max(0px)) {
      body {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  
  <script>
    // Register PWA service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(registration => {
          console.log('SW registered:', registration);
        }).catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
